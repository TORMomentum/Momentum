# Optional: give the Compose extraction worker a Vertex AI identity, so the stack runs ingest → extract → publish
# end to end (TOR-111). Without this file the worker logs `extraction_disabled` and leaves records queued.
#
#   docker compose -f docker-compose.yml -f docker-compose.vertex.yml up
#
# Every document the worker reads is a billed Document AI + Gemini call. The key file stays on the host and is
# mounted read-only into the worker alone; the api and web never see it. Storage stays on the emulator
# (GCS_API_ENDPOINT is still set), so the key is used for Vertex only.
services:
  worker:
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required for extraction}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vertex-key.json
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      DOCAI_LOCATION: ${DOCAI_LOCATION:-us}
      DOCAI_PROCESSOR_ID: ${DOCAI_PROCESSOR_ID:-}
      EXTRACT_TIMEOUT_MS: ${EXTRACT_TIMEOUT_MS:-120000}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?GOOGLE_APPLICATION_CREDENTIALS must name the key file on the host}:/run/secrets/vertex-key.json:ro
