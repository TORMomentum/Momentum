# TOR-140. Request-driven: scales to zero when idle, like a normal web service.
#
# Deployed with `gcloud run services replace` after envsubst fills the ${...}
# placeholders (see .github/workflows/deploy.yml) — nothing GCP-specific is
# hard-coded here (NFR-S7). `--no-allow-unauthenticated` and the
# `roles/run.invoker` grant for named reviewers are IAM, not expressible in
# this file; both are gcloud commands in docs/gcp-setup.md §7.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tor-radar-api
  labels:
    app: tor-radar
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root -- Cloud Run has no runAsNonRoot field; the image sets USER node (Dockerfile) and so never starts as root
    spec:
      containers:
        - image: ${AR_IMAGE_API}
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "8080"
            # TOR-318: hops between the API and the real client - Google's front end, then the web
            # service. The web service overwrites X-Forwarded-For with the one client address it
            # derived, and the front end appends the web instance's address, so the API reads the
            # client from the third address from the right. api is IAM-restricted, so only web can
            # reach it; see docs/superpowers/specs for the spoofing analysis.
            - name: TRUST_PROXY
              value: "2"
            - name: GCS_BUCKET
              value: ${GCS_BUCKET}
            - name: GOOGLE_CLOUD_PROJECT
              value: ${PROJECT_ID}
            - name: GCS_CREDENTIALS
              value: /secrets/gcs-sa/key.json
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/vertex-sa/key.json
            # The web service's own origin, for the accounts feature's CSRF check
            # (Origin header must match). Set by deploy.yml once tor-radar-web exists.
            - name: APP_ORIGIN
              value: ${APP_ORIGIN}
            # Sign in with Google (TOR-315). Off unless the GitHub variable GOOGLE_OAUTH_ENABLED is "true"; the
            # redirect URI is derived from APP_ORIGIN. The client SECRET is not mounted here, because a secretKeyRef
            # to a secret that does not exist fails the whole deploy: when enabling, create the Secret Manager
            # secret GOOGLE_OAUTH_CLIENT_SECRET and add the block below (docs/gcp-setup.md, "Sign in with Google").
            # The secret now exists (created 2026-11-22), so the block is mounted.
            - name: GOOGLE_OAUTH_ENABLED
              value: "${GOOGLE_OAUTH_ENABLED}"
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: "${GOOGLE_OAUTH_CLIENT_ID}"
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_OAUTH_CLIENT_SECRET
                  key: latest
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-url
                  key: latest
            - name: INTAKE_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: intake-api-keys
                  key: latest
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: SESSION_SECRET
                  key: latest
            # createMailer (apps/api/src/adapters/mailer.factory.ts) throws at
            # startup in production when this is blank — the worker never calls
            # it, so worker.yaml doesn't carry this one.
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: SMTP_URL
                  key: latest
          volumeMounts:
            - name: gcs-sa
              mountPath: /secrets/gcs-sa
              readOnly: true
            - name: vertex-sa
              mountPath: /secrets/vertex-sa
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: gcs-sa
          secret:
            secretName: gcs-storage-sa
            items:
              - key: latest
                path: key.json
        - name: vertex-sa
          secret:
            secretName: vertex-sa
            items:
              - key: latest
                path: key.json
