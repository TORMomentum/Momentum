name: Deploy to Cloud Run

# TOR-142. Manually triggered only — the app isn't feature-complete yet, and every
# service stays IAM-restricted (--no-allow-unauthenticated) regardless of who
# deploys it. Auto-deploy-on-merge is Sprint 6's decision, not this workflow's.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.GCP_AR_REPO }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOY_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the api image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AR_IMAGE_API=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push the web image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/web:${{ github.sha }}"
          docker build -f apps/web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "AR_IMAGE_WEB=$IMAGE" >> "$GITHUB_ENV"

      # web needs api's URL (API_BASE_URL) and api needs web's URL (APP_ORIGIN,
      # the accounts feature's CSRF check) — each needs the other's, and Cloud
      # Run only assigns a URL once a service exists. First pass creates web
      # with a placeholder API_BASE_URL just to get its real URL; the second
      # pass (after api and worker deploy) redeploys web with the real one.
      - name: Deploy web (first pass, establishes its URL)
        run: |
          API_SERVICE_URL="https://placeholder.invalid"
          export API_SERVICE_URL
          # web's own APP_ORIGIN (app/api/auth/[...path]/route.ts's same-origin check)
          # isn't known until this pass creates the service — the third pass below
          # redeploys with the real value once it exists.
          APP_ORIGIN="https://placeholder.invalid"
          export APP_ORIGIN
          envsubst < deploy/cloudrun/web.yaml > /tmp/web.yaml
          gcloud run services replace /tmp/web.yaml --region "$REGION"

      # api and worker share the api image but are separate services (different
      # scaling, different command) — see deploy/cloudrun/worker.yaml.
      - name: Deploy api and worker
        run: |
          APP_ORIGIN=$(gcloud run services describe tor-radar-web --region "$REGION" --format='value(status.url)')
          export APP_ORIGIN
          envsubst < deploy/cloudrun/api.yaml > /tmp/api.yaml
          gcloud run services replace /tmp/api.yaml --region "$REGION"
          envsubst < deploy/cloudrun/worker.yaml > /tmp/worker.yaml
          gcloud run services replace /tmp/worker.yaml --region "$REGION"

      - name: Redeploy web with api's real URL
        run: |
          API_SERVICE_URL=$(gcloud run services describe tor-radar-api --region "$REGION" --format='value(status.url)')
          export API_SERVICE_URL
          # web's URL is stable across revisions once the first pass creates it, so
          # this is the real value from here on, not another placeholder.
          APP_ORIGIN=$(gcloud run services describe tor-radar-web --region "$REGION" --format='value(status.url)')
          export APP_ORIGIN
          envsubst < deploy/cloudrun/web.yaml > /tmp/web.yaml
          gcloud run services replace /tmp/web.yaml --region "$REGION"

      # `services replace` only ever applies deploy/cloudrun/web.yaml's own spec, and IAP
      # enablement isn't expressible in that Knative YAML — it's a separate setting on the
      # service resource. Every replace above therefore silently drops it, so it has to be
      # reasserted after each deploy, not configured once by hand. --iap sets up the IAP
      # service agent's own invoker binding itself (confirmed live: "Setting IAP service
      # agent ... done" in its own output) — no separate add-iam-policy-binding call needed,
      # and that extra call only cost a dependency on an API this project never enabled
      # (cloudresourcemanager.googleapis.com, to look up the project number). Idempotent:
      # safe to repeat against a service that's already IAP-enabled.
      - name: Re-assert IAP on web (services replace doesn't carry it)
        run: gcloud run services update tor-radar-web --region "$REGION" --iap
