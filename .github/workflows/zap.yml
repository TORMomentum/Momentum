name: ZAP DAST

# A passive OWASP ZAP scan of the running Compose stack (TOR-322, criterion 15).
# Weekly and on demand; it is not a pull-request gate because it builds both
# images and takes several minutes. The reports are uploaded as a run artifact.
# WARN-level alerts never fail the run; a High alert or a FAIL rule in
# tools/zap/zap-rules.tsv does. How to read the result: docs/security/dast-report.md.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: momentum
      # Throwaway values, as in ci.yml: they sign nothing that outlives the run.
      SESSION_SECRET: zap-session-secret-not-used-outside-this-run
      APP_ORIGIN: http://web:3000
      INTAKE_API_KEYS: zap-intake-key
      ADMIN_API_KEYS: zap-admin-key
      STAFF_ACCESS_SECRET: zap-staff-secret-not-used-outside-this-run
      WEB_PORT: 3000
      API_PORT: 4000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up -d --build
      - name: Wait for web and api
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null \
              && curl -sf http://localhost:4000/health >/dev/null \
              && exit 0
            sleep 2
          done
          echo "the stack did not become ready" >&2
          docker compose logs
          exit 1
      - name: ZAP baseline (web) and API scan
        run: tools/zap/run.sh
        env:
          ZAP_LABEL: ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-reports
          path: zap-reports/ci.*/
          if-no-files-found: warn
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - run: docker compose down -v
        if: always()
