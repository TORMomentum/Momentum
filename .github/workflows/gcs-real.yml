name: gcs-real

# Proves what fake-gcs-server cannot: real preconditions, real permission
# denials, a real MD5 rejection (spec §7). Manually triggered, never a
# pull-request gate — it needs credentials and writes to a real (disposable)
# bucket.
#
# Repo setup this workflow assumes (Task 16):
#   - Workload Identity Federation provider + a dedicated GitHub-Actions
#     service account, bound only to the disposable test bucket.
#   - Secrets: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   - Repo variable: GCS_REAL_TEST_BUCKET (the disposable test bucket name)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  real-bucket:
    name: "real-bucket (manual, not a PR gate)"
    runs-on: ubuntu-latest
    steps:
      - name: Require the bucket variable and auth secrets
        run: |
          missing=0
          [ -z "${{ vars.GCS_REAL_TEST_BUCKET }}" ] && echo "GCS_REAL_TEST_BUCKET repo variable is not set" >&2 && missing=1
          [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && echo "GCP_WORKLOAD_IDENTITY_PROVIDER secret is not set" >&2 && missing=1
          [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ] && echo "GCP_SERVICE_ACCOUNT secret is not set" >&2 && missing=1
          exit $missing

      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - run: npm ci
      - run: npx vitest run apps/api/src/adapters/gcs.storage.real.test.ts
        env:
          GCS_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GCS_REAL_TEST_BUCKET: ${{ vars.GCS_REAL_TEST_BUCKET }}
