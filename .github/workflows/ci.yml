name: CI

on:
  pull_request:
    # labeled/unlabeled so the docs-not-needed label takes effect without a new push
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/tor_radar
      GCS_BUCKET: tor-raw
      GCS_API_ENDPOINT: http://localhost:4443
      INTAKE_API_KEYS: ci-intake-key
      ADMIN_API_KEYS: ci-admin-key
      # Compose refuses to start without one, deliberately: a session signing key
      # must never fall back to a default. CI supplies a throwaway value — it
      # signs nothing that outlives the run.
      SESSION_SECRET: ci-session-secret-not-used-outside-this-run
      APP_ORIGIN: http://web:3000
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs-drift check diffs the branch against its base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node tools/check_mermaid.mjs
      # A code change must carry the doc that describes it (CLAUDE.md, "Docs stay
      # current"). The docs-not-needed label lets a genuine exception through.
      - name: Docs in step with code
        if: github.event_name == 'pull_request'
        env:
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
        run: node tools/check_docs_drift.mjs origin/${{ github.base_ref }}
      # The integration tests (mongo.queue, gcs.storage, intake.repository) hit a
      # real stack, so CI brings up the same containers the compose file defines.
      - run: docker compose up -d mongo gcs
      - name: Wait for mongo and gcs
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/27017) 2>/dev/null \
              && curl -sf http://localhost:4443/storage/v1/b \
              && exit 0
            sleep 1
          done
          echo "mongo/gcs did not become ready" >&2
          docker compose logs mongo gcs
          exit 1
      # Build BEFORE testing. packages/ ships compiled output, and the apps
      # import that, not its source — so a suite run first passes against a
      # source tree the running app never sees. The work taxonomy was edited
      # and the app kept serving the previous one exactly this way.
      - run: npm run build
      - run: npm test
