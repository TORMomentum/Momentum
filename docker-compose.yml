# The api and the worker share one image and one configuration; they differ
# only by command. Full compose hardening - health checks, container names, the
# two-stage image - is Slice-1 Task 15.
x-api-env: &api-env
  API_PORT: 4000
  MONGO_URL: mongodb://mongo:27017/tor_radar
  GCS_BUCKET: ${GCS_BUCKET:-tor-raw}
  GCS_API_ENDPOINT: http://gcs:4443
  INTAKE_API_KEYS: ${INTAKE_API_KEYS:-change-me-intake-key}
  ADMIN_API_KEYS: ${ADMIN_API_KEYS:-change-me-admin-key}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-4000}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-4000}:4000"
    environment: *api-env
    depends_on:
      - mongo
      - gcs

  # The extraction worker: same image, run the poll loop instead of the HTTP
  # server. A separate service so restarting the api never interrupts a job in
  # flight and the worker's failures surface in its own logs.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "worker"]
    environment: *api-env
    depends_on:
      - mongo
      - gcs

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  gcs:
    # Google Cloud Storage emulator for development and CI. Pinned: `latest`
    # resolves wherever it was pulled before and fails everywhere else, which is
    # exactly how the MinIO image broke CI. It does NOT validate signed-URL
    # signatures or checksums the way the real service does (spec §7) — the
    # real-bucket suite proves those.
    image: fsouza/fake-gcs-server:1.56.1
    command: ["-scheme", "http", "-port", "4443", "-backend", "filesystem", "-filesystem-root", "/data"]
    ports:
      - "${GCS_EMULATOR_PORT:-4443}:4443"
    volumes:
      - gcs_data:/data

volumes:
  mongo_data:
  gcs_data:
